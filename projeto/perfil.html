<!DOCTYPE html>
<html lang="pt-BR" >

<head>
    <meta charset="UTF-8">
    <title>criar perfil</title>

    </style>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        h1, h6, h5 {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            letter-spacing: 3px;
        }
    </style>

    </style>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        label {
            font-family: 'Montserrat', sans-serif;
            font-weight: 500;
            letter-spacing: 3px;
        }
    </style>

    <style>
        .userData {
            position: relative;
            width: 300px;
            margin: 20px 0;
            font-weight: 500;
            letter-spacing: 3px;
            text-align: center;
        }

        .userData input {
            width: 100%;
            border: none;
            border-bottom: 1px solid #ccc;
            padding: 8px 0;
            font-size: 12px;
            outline: none;
            background: none;
            display: inline;
            font-weight: 500;
            letter-spacing: 3px;
        }

        .userData input:focus {
            border-bottom: 1px solid #767575;
        }

        .userData label {
            position: absolute;
            left: 0;
            top: -10px;
            color: #777;
            font-size: 14px;
            transition: 0.2s;
            font-weight: 500;
            letter-spacing: 3px;
            text-align: center;
        }

        .userData input:focus + label ,
        .userData input:valid {
            top: -6px;
            font-size: 14px;
            color: #3226da;
        }
    </style>

    <style>
    .userTheme select { 
        appearance: none;
        -webkit-appearance: slider-vertical;            
        width : 20% ;
        font-size: 13px ; 
        padding: 8px 0;       
        background-color : #e5ebf1 ; 
        border : none ;         
        color: hsl(239, 65%, 55%);
        font-weight: 500;
        letter-spacing: 3px;
        text-align: center;
        
    }
    </style>

    <style>
    .userFormat select {
        appearance: none;
        -webkit-appearance: slider-vertical;            
        width : 10% ;
        font-size: 13px ; 
        padding: 8px 0;       
        background-color : #e5ebf1 ; 
        border : none ;         
        color: hsl(239, 65%, 55%);
        font-weight: 500;
        letter-spacing: 3px;
        text-align: center;
        
        
    }
    </style>

    <style>
    .font select {
        appearance: none;
        -webkit-appearance: slider-vertical;            
        width : 15% ;
        font-size: 13px ; 
        padding: 8px 0;       
        background-color : #e5ebf1 ; 
        border : none ;         
        color: hsl(239, 65%, 55%);
        font-weight: 500;
        letter-spacing: 3px;
        text-align: center;
        
    }
    </style>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #000000;

        }
        body.root input,
        body.root select,
        body.root label {
            color: #0b0a0a;
        }  

        .sepia {
           --bg-color: #f4ecd8;
           --text-color: #4b3b2f;
        }
        body.sepia input,
        body.sepia select,
        body.sepia label {
            color: #0b0a0a;
        }

        .amoled {
           --bg-color: #000;
           --text-color: #fff;
        }
        body.amoled input,
        body.amoled select{
            color: white !important;
            background-color: #2c2b2b;
            border-color: #666;

        }
        body.amoled option {
            color: white;
            background-color: #333;
        }
        
        body.amoled label {
            color: #f3f3f3;
        }
        
        body {
           background-color: var(--bg-color);
           color: var(--text-color);
           transition: background-color 0.3s, color 0.3s;
           font-family: sans-serif;
           margin: 0;
           padding: 20px;
        }

header {
    margin-bottom: 20px;
}
    </style>
    <style>
        :root {           
            --text-color: #000000;            
            --input-text: #000000;
        }  
        
        body.highcontrast {
            --text-color: #00ff00;                    
            --input-text: #00ff00;           
            
        }
    </style>

</head>

<body onload="initProfile()">

    <h1 class="title">Perfil</h1><br>

    <div class="userData">
        <input type="email" id="email">
        <label for="email">E-mail</label>
    </div>

    <div class="userData">
        <input id="name" type="text" >
        <label for="name">Nome</label>
    </div>

    <div class="userData">
        <input id="age" type="number" >
        <label for="age">Idade</label>
    </div>

    <h5 class="userPreferency">Preferências</h5>

    <div class="userTheme">
    </select>
    <label for="userTheme">Tema:</label>
    <select name="theme" id="theme">
        <option value="light">Light</option>
        <option value="sepia">Sepia</option>
        <option value="amoled"> Dark</option>
    </select></div>

    <br><br>

    <div class="font">
    </select>
    <label for="font">Cor da Fonte:</label>
    <select name="theme" id="font">
        <option value="root">Padrão</option>
        <option value="highcontrast">Alto Contraste</option>  

    </select></div>

    <br><br>

    <button onclick="createUser()">Salvar</button>
    <br></br>

    <button onclick="deleteUser(email)">Deletar</button>
    <br></br>

    <button onclick="Logout(email)">Sair</button>

    <script src="script.js" defer></script>

</body>

</html>
