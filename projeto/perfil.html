<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>criar perfil</title>

    </style>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        h1, h6, h5 {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            letter-spacing: 3px;
        }
    </style>

    </style>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        label {
            font-family: 'Montserrat', sans-serif;
            font-weight: 500;
            letter-spacing: 3px;
        }
    </style>

    <style>
        .userData {
            position: relative;
            width: 300px;
            margin: 20px 0;
            font-weight: 500;
            letter-spacing: 3px;
            text-align: center;
        }

        .userData input {
            width: 100%;
            border: none;
            border-bottom: 1px solid #ccc;
            padding: 8px 0;
            font-size: 12px;
            outline: none;
            background: none;
            display: inline;
            font-weight: 500;
            letter-spacing: 3px;
        }

        .userData input:focus {
            border-bottom: 1px solid #767575;
        }

        .userData label {
            position: absolute;
            left: 0;
            top: -10px;
            color: #777;
            font-size: 14px;
            transition: 0.2s;
            font-weight: 500;
            letter-spacing: 3px;
            text-align: center;
        }

        .userData input:focus + label ,
        .userData input:valid {
            top: -6px;
            font-size: 14px;
            color: #3226da;
        }
    </style>

    <style>
    .userTheme select { 
        appearance: none;
        -webkit-appearance: slider-vertical;            
        width : 10% ;
        font-size: 13px ; 
        padding: 8px 0;       
        background-color : #e5ebf1 ; 
        border : none ;         
        color: hsl(239, 65%, 55%);
        font-weight: 500;
        letter-spacing: 3px;
        text-align: center;
        
    }
    </style>

    <style>
    .userFormat select {
        appearance: none;
        -webkit-appearance: slider-vertical;            
        width : 10% ;
        font-size: 13px ; 
        padding: 8px 0;       
        background-color : #e5ebf1 ; 
        border : none ;         
        color: hsl(239, 65%, 55%);
        font-weight: 500;
        letter-spacing: 3px;
        text-align: center;
        
        
    }
    </style>

    <style>
    .userLang select {
        appearance: none;
        -webkit-appearance: slider-vertical;            
        width : 15% ;
        font-size: 13px ; 
        padding: 8px 0;       
        background-color : #e5ebf1 ; 
        border : none ;         
        color: hsl(239, 65%, 55%);
        font-weight: 500;
        letter-spacing: 3px;
        text-align: center;
        
    }
    </style>
</head>

<body onload="iniciarPerfil()">

    <h1 class="title">Perfil</h1><br>

    <div class="userData">
        <input type="email" id="email">
        <label for="email">E-mail</label>
    </div>

    <div class="userData">
        <input id="name" type="text" >
        <label for="name">Nome</label>
    </div>

    <div class="userData">
        <input id="age" type="number" >
        <label for="age">Idade</label>
    </div>

    <h5 class="userPreferency">Preferências</h5>

    <div class="userTheme">
    </select>
    <label for="userTheme">Tema:</label>
    <select name="theme" id="userTheme">
        <option value="Claro">Claro</option>
        <option value="Escuro">Escuro</option>
    </select></div>

    <br><br>

    <div class="userFormat">
    </select>
    <label for="userFormat">Cor da Fonte:</label>
    <select name="format" id="userFormat">
        <option value="Azul">Azul</option>
        <option value="Preto">Escuro</option>
        <option value="Verde">Verde</option>
    </select></div>

    <br><br>

    <div class="userLang">
    </select>
    <label for="userLang">Idioma:</label>
    <select name="lang" id="userLang">
        <option value="Português">Português</option>
        <option value="English">English</option>
        <option value="Espanhol">Espanhol</option>
    </select></div>

    <br><br>

    <button onclick="createUser()">Salvar</button>
    <br></br>

    <button onclick="Logout(email)">Sair</button>

    <pre id="out"></pre>

    <script src="script.js" defer></script>

</body>

</html>
