<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>login</title>
  <style>
    :root{
      --bg: #fff;
      --primary: #4a3aff;
      --destructive: #ff3b30;
      --text: #111;
      --muted: #6b6b6b;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      margin: 0;
      min-height: 100vh;
      background: #f6f7fb;
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 40px;
      color: var(--text);
    }

    .btn {
      background: var(--primary);
      color: white;
      padding: 12px 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      box-shadow: 0 6px 18px rgba(75,30,200,0.12);
    }

    /* Backdrop */
    .backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s ease;
      z-index: 50;
    }
    .backdrop.show {
      opacity: 1;
      pointer-events: auto;
    }

    /* Action sheet panel */
    .action-sheet {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      transform: translateY(110%);
      transition: transform .28s cubic-bezier(.2,.9,.3,1);
      z-index: 60;
      padding: 12px;
      box-sizing: border-box;
      display:flex;
      justify-content:center;
      pointer-events: none;
    }
    .action-sheet.show {
      transform: translateY(0);
      pointer-events: auto;
    }

    .sheet-content {
      width: 100%;
      max-width: 640px;
      background: var(--bg);
      border-radius: 14px 14px 8px 8px;
      box-shadow: 0 -8px 30px rgba(20,20,50,0.12);
      overflow: hidden;
    }

    .sheet-header {
      padding: 14px 18px;
      border-bottom: 1px solid #eee;
      font-weight: 700;
      font-size: 15px;
    }

    .sheet-buttons {
      display: flex;
      flex-direction: column;
    }

    .sheet-buttons button {
      background: transparent;
      border: none;
      padding: 16px 18px;
      text-align: left;
      font-size: 15px;
      cursor: pointer;
      width: 100%;
    }

    .sheet-buttons button + button {
      border-top: 1px solid #f0f0f0;
    }

    .btn-destructive {
      color: var(--destructive);
      font-weight: 700;
    }

    .btn-normal {
      color: var(--text);
    }

    .btn-cancel {
      margin: 10px;
      background: #fafafa;
      border-radius: 10px;
      padding: 14px;
      text-align:center;
      font-weight:600;
      color: var(--muted);
      border: 1px solid #eee;
    }

    /* small screens spacing tweak */
    @media (max-width:420px){
      .sheet-header { font-size:14px; }
      .sheet-buttons button { padding:14px; font-size:14px; }
    }
  </style>
</head>
<body>

 <!--<button id="openBtn" class="btn" aria-haspopup="dialog">login</button> -->
  <div><div><button id="loginBtn" class="btn" aria-haspopup="dialog">login</button>
   <button id="createBtn" class="btn" aria-haspopup="dialog">criar perfil</button></div>

  <!-- Backdrop -->
  <div id="backdrop" class="backdrop" tabindex="-1" aria-hidden="true"></div>

  <div> <!-- Action sheet -->
  <div id="actionSheet" class="action-sheet" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="sheetHeader">
    <div class="sheet-content" role="document">
      <div id="sheetHeader" class="sheet-header">Actions</div>

      <div class="sheet-buttons" role="group" aria-label="Ações">
        <button id="deleteBtn" class="btn-destructive" type="button" data-action="delete">Delete</button>
        <button id="shareBtn" class="btn-normal" type="button" data-action="share">Share</button>

        <div style="padding:10px; background:transparent;">
          <button id="cancelBtn" class="btn-cancel" type="button" data-action="cancel">Cancel</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function(){
      //const openBtn = document.getElementById('openBtn');
      const loginBtn = document.getElementById('loginBtn');
      const createBtn = document.getElementById('createBtn');
      const actionSheet = document.getElementById('actionSheet');
      const backdrop = document.getElementById('backdrop');
      const deleteBtn = document.getElementById('deleteBtn');
      const shareBtn = document.getElementById('shareBtn');
      const cancelBtn = document.getElementById('cancelBtn');

      function openSheet() {
        actionSheet.classList.add('show');
        backdrop.classList.add('show');
        actionSheet.setAttribute('aria-hidden', 'false');
        backdrop.setAttribute('aria-hidden', 'false');

        // trap focus inside sheet for accessibility
        cancelBtn.focus();
        document.body.style.overflow = 'hidden';
      }

      function closeSheet(reason = null) {
        actionSheet.classList.remove('show');
        backdrop.classList.remove('show');
        actionSheet.setAttribute('aria-hidden', 'true');
        backdrop.setAttribute('aria-hidden', 'true');
        document.body.style.overflow = '';
       // openBtn.focus();
        loginBtn.focus();

        // Dispatch a custom event similar to Ionic's ionActionSheetDidDismiss
        const event = new CustomEvent('actionSheetDidDismiss', { detail: { action: reason } });
        actionSheet.dispatchEvent(event);
      }

      //openBtn.addEventListener('click', openSheet);
      loginBtn.addEventListener('click', openSheet);
      backdrop.addEventListener('click', () => closeSheet('backdrop'));
      cancelBtn.addEventListener('click', () => closeSheet('cancel'));

      deleteBtn.addEventListener('click', () => {
        // exemplo: ação de deletar
        console.log('Delete clicked');
        closeSheet('delete');
      });
      shareBtn.addEventListener('click', () => {
        console.log('Share clicked');
        closeSheet('share');
      });

      // support Esc key to close
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && actionSheet.classList.contains('show')) {
          closeSheet('escape');
        }
      });

      // example of listening to the custom dismiss event:
      actionSheet.addEventListener('actionSheetDidDismiss', (e) => {
        console.log('Action sheet dismissed with action:', e.detail.action);
        // aqui você pode reagir conforme a ação (delete/share/cancel)
      });
    })();
  </script>
</body>
</html>
